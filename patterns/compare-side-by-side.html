<!doctype html>
<!-- PATTERN: compare-side-by-side (static)
     WHEN: option A vs B, before/after.
     SLOTS: TITLE, LEFT_TITLE, LEFT_BODY, RIGHT_TITLE, RIGHT_BODY.
     MODE: static — open as a file. Self-contained, no server needed. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title><!-- SLOT: TITLE -->A vs B</title>
  <style>
    :root {
      --bg:#0f1116; --panel:#181b22; --line:#2b313c;
      --ink:#e6e9ef; --muted:#9aa4b2;
      --radius:12px; --gap:16px;
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.5; padding:24px; }
    h1 { margin:0 0 .4em; } .sub { color:var(--muted); margin-bottom:24px; }
    .grid { display:grid; gap:var(--gap); grid-template-columns:1fr 1fr; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
    .card h3 { font-size:15px; margin:0 0 .4em; }
  </style>
</head>
<body>
  <h1><!-- SLOT: TITLE -->A vs B</h1>
  <div class="sub"><!-- SLOT: SUBTITLE --></div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card"><h3><!-- SLOT: LEFT_TITLE -->Option A</h3><div><!-- SLOT: LEFT_BODY --></div></div>
    <div class="card"><h3><!-- SLOT: RIGHT_TITLE -->Option B</h3><div><!-- SLOT: RIGHT_BODY --></div></div>
  </div>
</body>
</html>
