<!doctype html>
<!-- PATTERN: data-metrics (static)
     WHEN: headline KPI tiles.
     SLOTS: TITLE, TILES (repeat .card block per metric).
     MODE: static — open as a file. Self-contained, no server needed. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title><!-- SLOT: TITLE -->Key metrics</title>
  <style>
    :root {
      --bg:#0f1116; --panel:#181b22; --line:#2b313c;
      --ink:#e6e9ef; --muted:#9aa4b2;
      --radius:12px; --gap:16px;
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.5; padding:24px; }
    h1 { margin:0 0 .4em; } .sub { color:var(--muted); margin-bottom:24px; }
    .grid { display:grid; gap:var(--gap); grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
    .muted { color:var(--muted); }
    .metric { font-size:34px; font-weight:700; }
  </style>
</head>
<body>
  <h1><!-- SLOT: TITLE -->Key metrics</h1>
  <div class="sub"><!-- SLOT: SUBTITLE --></div>
  <div class="grid"><!-- SLOT: TILES — repeat per metric -->
    <div class="card"><div class="muted">Metric label</div><div class="metric">0</div></div>
  </div>
</body>
</html>
